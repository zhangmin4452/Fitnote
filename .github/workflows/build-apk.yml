name: Build FitNote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解压项目
        run: |
          rm -rf project
          mkdir -p project
          unzip -o FitNote-GitHub-APK.zip -d project

          echo "===== 解压后的目录 ====="
          find project -maxdepth 3 -type f | sort | head -100

      - name: 定位 Gradle 项目
        run: |
          if [ -f "project/settings.gradle.kts" ] || [ -f "project/settings.gradle" ]; then
            echo "GRADLE_DIR=project" >> "$GITHUB_ENV"
          elif [ -f "project/fitnote_work/settings.gradle.kts" ] || [ -f "project/fitnote_work/settings.gradle" ]; then
            echo "GRADLE_DIR=project/fitnote_work" >> "$GITHUB_ENV"
          else
            echo "找不到 Gradle 项目根目录"
            find project -maxdepth 5 -type f \( -name "settings.gradle*" -o -name "build.gradle*" \) -print
            exit 1
          fi

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 配置 Gradle
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF

      - name: 创建 Android 17 编译配置
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          cat > ci.init.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->
                  def androidExtension = project.extensions.findByName("android")

                  if (androidExtension != null) {
                      androidExtension.compileOptions {
                          sourceCompatibility JavaVersion.VERSION_17
                          targetCompatibility JavaVersion.VERSION_17
                      }
                  }

                  project.tasks.configureEach { task ->
                      if (task.name.toLowerCase().contains("kotlin")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Exception ignored) {
                          }
                      }
                  }
              }
          }
          EOF

      - name: 检查项目
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          echo "===== Gradle 项目目录 ====="
          pwd
          ls -la
          java -version
          gradle --version

      - name: 编译 APK
        working-directory: ${{ env.GRADLE_DIR }}
        run: |
          gradle --stop || true
          gradle assembleDebug --no-daemon --stacktrace --init-script ci.init.gradle

      - name: 查找 APK
        run: |
          echo "===== APK 文件 ====="
          find project -type f -name "*.apk" -print

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: FitNote-APK
          path: ${{ env.GRADLE_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
