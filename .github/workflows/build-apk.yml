name: Build FitNote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解压项目
        run: |
          rm -rf project
          mkdir project
          unzip -o FitNote-GitHub-APK.zip -d project

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 配置 AndroidX
        working-directory: project
        run: |
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" >> gradle.properties
          echo "org.gradle.workers.max=2" >> gradle.properties
          echo "org.gradle.parallel=false" >> gradle.properties

      - name: 修复 Java Kotlin JVM 版本
        working-directory: project
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path(".").rglob("build.gradle")) + list(Path(".").rglob("build.gradle.kts"))

          for file in files:
              text = file.read_text()

              if "build.gradle.kts" in file.name:
                  text += """

          // CI JVM target compatibility
          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """
              else:
                  text += """

          // CI JVM target compatibility
          android {
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          """

              file.write_text(text)
              print("Patched:", file)
          PY

      - name: 编译 APK
        working-directory: project
        run: |
          gradle --stop || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: 查找 APK
        run: |
          echo "===== APK 文件 ====="
          find project -type f -name "*.apk" -print

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: FitNote-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
