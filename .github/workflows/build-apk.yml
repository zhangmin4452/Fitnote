name: Build FitNote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解压项目
        run: |
          rm -rf project
          mkdir project
          unzip -o FitNote-GitHub-APK.zip -d project

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: 配置 Gradle
        working-directory: project
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF

      - name: 创建编译配置
        working-directory: project
        run: |
          cat > ci.init.gradle <<'EOF'
          allprojects {
              afterEvaluate { project ->

                  // 强制所有 Java 编译任务使用 Java 17
                  project.tasks.configureEach { task ->
                      if (task instanceof JavaCompile) {
                          task.options.release = 17
                          task.sourceCompatibility = "17"
                          task.targetCompatibility = "17"
                      }

                      // 不直接引用 KotlinCompile 类，
                      // 避免不同 Kotlin 插件版本导致初始化脚本报错
                      if (task.name.toLowerCase().contains("kotlin")) {
                          try {
                              task.kotlinOptions.jvmTarget = "17"
                          } catch (Exception ignored) {
                          }
                      }
                  }

                  // Android 项目强制 Java 17
                  def androidExtension = project.extensions.findByName("android")

                  if (androidExtension != null) {
                      try {
                          androidExtension.compileOptions {
                              sourceCompatibility JavaVersion.VERSION_17
                              targetCompatibility JavaVersion.VERSION_17
                          }
                      } catch (Exception ignored) {
                      }
                  }
              }
          }
          EOF

      - name: 检查 Java 和 Kotlin 配置
        working-directory: project
        run: |
          echo "===== Java 版本 ====="
          java -version

          echo "===== Gradle 版本 ====="
          gradle --version

          echo "===== 项目文件 ====="
          find . -maxdepth 3 -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

      - name: 编译 APK
        working-directory: project
        run: |
          gradle --stop || true
          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --init-script ci.init.gradle

      - name: 查找 APK
        run: |
          echo "===== APK 文件 ====="
          find project -type f -name "*.apk" -print

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: FitNote-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
